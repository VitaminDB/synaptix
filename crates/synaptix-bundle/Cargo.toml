[package]
name = "synaptix-bundle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Synaptix bundle: .syn — single-file model format (zero-copy mmap, central directory, refs)."

[dependencies]
safetensors.workspace = true
memmap2.workspace = true
crc32c.workspace = true
ciborium.workspace = true
fs4.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
byteorder.workspace = true
sha2 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }

[features]
default = []
sha256 = ["dep:sha2"]
blake3 = ["dep:blake3"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bin]]
name = "syn-pack"
path = "src/bin/syn_pack.rs"

[[bin]]
name = "syn-info"
path = "src/bin/syn_info.rs"

[[bin]]
name = "syn-unpack"
path = "src/bin/syn_unpack.rs"

[[bin]]
name = "syn-add"
path = "src/bin/syn_add.rs"

[[bin]]
name = "syn-rm"
path = "src/bin/syn_rm.rs"

[[bin]]
name = "syn-mv"
path = "src/bin/syn_mv.rs"

[[bin]]
name = "syn-compact"
path = "src/bin/syn_compact.rs"

[[bin]]
name = "syn-verify"
path = "src/bin/syn_verify.rs"

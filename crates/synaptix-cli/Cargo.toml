[package]
name = "synaptix-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Synaptix: `synaptix` CLI (run/bench/quantize/convert)."

[dependencies]
synaptix-core         = { workspace = true }
synaptix-infer        = { workspace = true }
synaptix-train        = { workspace = true }
synaptix-kernels-cpu  = { workspace = true }
synaptix-kernels-cuda = { workspace = true }
synaptix-bundle       = { workspace = true }
synaptix-gguf         = { workspace = true, optional = true }
synaptix-tokenizer    = { workspace = true }
synaptix-debug        = { workspace = true }
synaptix-llm-common   = { workspace = true }
synaptix-llm-qwen3    = { workspace = true }
synaptix-llm-qwen3-next-hybrid = { workspace = true }
synaptix-llm-muse-glimmer = { workspace = true }
synaptix-vlm-qwen3    = { workspace = true }
synaptix-asr-whisper  = { workspace = true }
synaptix-image-sdxl   = { workspace = true }
synaptix-image-flux   = { workspace = true }
synaptix-video-minimax-h3 = { workspace = true }
synaptix-video-ltx23  = { workspace = true }
synaptix-tts-voxcpm   = { workspace = true }
synaptix-music-acestep = { workspace = true }
synaptix-audio        = { workspace = true }
synaptix-depth-anything = { workspace = true }
synaptix-llm-gemma3   = { workspace = true }
synaptix-io           = { workspace = true, features = ["image"] }
synaptix               = { workspace = true }
thiserror          = { workspace = true }
clap               = { workspace = true }
indicatif          = { workspace = true }
ratatui            = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm          = { workspace = true }
tokio              = { workspace = true }
serde_json         = { workspace = true }
safetensors        = "0.7"

[features]
default = []
gguf = ["dep:synaptix-gguf"]

[dev-dependencies]
tempfile           = { workspace = true }

[[bin]]
name = "synaptix"
path = "src/bin/synaptix.rs"

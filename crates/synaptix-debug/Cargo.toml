description = "Synaptix: bit-exact debug (dump/compare/NaN-detector/shape-assert)."

[dependencies]
synaptix-core = { workspace = true }
thiserror     = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }

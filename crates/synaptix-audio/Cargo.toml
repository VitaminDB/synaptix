[package]
name = "synaptix-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Synaptix: audio utilities (mel/VAD/codecs/resample/streaming)."

[features]
# Нейросетевые детекторы (Silero и TEN VAD, openWakeWord) — на тензорах.
# Без фичи — только обработка сигнала: ресемплинг, mel, STFT, энергия/WebRTC VAD.
default = ["nn"]
nn = ["dep:synaptix-ops", "dep:synaptix-nn"]

[dependencies]
synaptix-core = { workspace = true }
synaptix-ops  = { workspace = true, optional = true }
synaptix-nn   = { workspace = true, optional = true }
thiserror     = { workspace = true }
rustfft       = { workspace = true }
hound         = { workspace = true }
rubato        = { workspace = true }

[dev-dependencies]
synaptix-kernels-cpu = { workspace = true }
tempfile             = { workspace = true }

[package]
name = "synaptix-asr-wav2vec2"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Wav2Vec2 / XLS-R encoder with CTC head (phoneme and character recognition)."

[features]
default = []
# Дообучение CTC (synaptix-train + autograd).
train = ["dep:synaptix-train", "dep:synaptix-autograd"]

[dependencies]
synaptix-core   = { workspace = true }
synaptix-ops    = { workspace = true }
synaptix-bundle = { workspace = true }
synaptix-io     = { workspace = true }
synaptix-audio  = { workspace = true }
thiserror       = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
safetensors     = { workspace = true }
synaptix-train    = { workspace = true, optional = true }
synaptix-autograd = { workspace = true, optional = true }

[dev-dependencies]
synaptix-autograd = { workspace = true }
synaptix-train = { workspace = true }
synaptix-kernels-cpu = { workspace = true }
synaptix-kernels-cuda = { workspace = true }

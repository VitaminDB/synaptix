[package]
name = "synaptix-embedding-bge-m3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "BGE-M3 multilingual embedder (XLM-RoBERTa)."

[features]
default = []
cuda = ["synaptix-core/cuda"]

[dependencies]
synaptix-core      = { workspace = true }
synaptix-ops       = { workspace = true }
synaptix-nn        = { workspace = true }
synaptix-tokenizer = { workspace = true }
synaptix-bundle    = { workspace = true }
synaptix-config    = { workspace = true }
synaptix-io        = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
safetensors        = { workspace = true }

[dev-dependencies]
synaptix-kernels-cpu  = { workspace = true }
synaptix-kernels-cuda = { workspace = true, features = ["cuda"] }

[package]
name = "synaptix-tts-vibevoice"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "VibeVoice — long-form multi-speaker TTS with voice cloning (Qwen2 LM + acoustic/semantic σ-VAE + diffusion head)."

[features]
default = ["audio-decode"]
audio-decode = ["synaptix-io/audio"]

[dependencies]
synaptix-core      = { workspace = true }
synaptix-ops       = { workspace = true }
synaptix-nn        = { workspace = true }
synaptix-tokenizer = { workspace = true }
synaptix-bundle    = { workspace = true }
synaptix-config    = { workspace = true }
synaptix-audio     = { workspace = true }
synaptix-io        = { workspace = true }
synaptix-infer     = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
safetensors        = { workspace = true }

[dev-dependencies]
synaptix-kernels-cpu = { workspace = true }
synaptix-kernels-cuda = { workspace = true }

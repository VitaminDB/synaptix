[package]
name = "synaptix-vlm-qwen3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Qwen3-VL / Qwen3.6 vision tower (SigLIP-style ViT + 2x2 patch merger) native Rust port."

[features]
default = []

[dependencies]
synaptix-core   = { workspace = true }
synaptix-nn     = { workspace = true }
synaptix-ops    = { workspace = true }
synaptix-io     = { workspace = true, features = ["image"] }
synaptix-bundle = { workspace = true }
synaptix-tokenizer = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
synaptix-kernels-cpu = { workspace = true }

[package]
name = "synaptix-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Synaptix: фундамент тензоров, dtype, device."

[features]
# GPU — дефолтный режим synaptix. cudarc/CUDA-код компилятся всегда; выбор
# Cuda/Cpu — в рантайме. Потребителям не нужно прописывать `cuda`.
default = ["cuda"]
cuda = ["dep:cudarc"]

[dependencies]
thiserror   = { workspace = true }
half        = { workspace = true }
bytemuck    = { workspace = true }
num-traits  = { workspace = true }
rayon       = { workspace = true }
parking_lot = { workspace = true }
once_cell   = { workspace = true }
rand        = { workspace = true }
serde       = { workspace = true }
bincode     = { workspace = true }
cudarc      = { workspace = true, optional = true }
libc        = { workspace = true }

[dev-dependencies]
proptest            = { workspace = true }
synaptix-test-utils = { workspace = true }

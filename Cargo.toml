[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
authors = ["Alexeyev Vitaly"]
license = "MIT OR Apache-2.0"

# Общий каталог зависимостей.

[workspace.dependencies]
# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# preserve_order нужен synaptix-крейтам (workspace=true); фича аддитивна
# (serde_json::Map → IndexMap, сохраняет порядок ключей).
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

# Logging / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Model weights container.
safetensors = "0.7"

# Tokenization
tokenizers = "0.23.1"

# Audio
hound = "3.5"
rubato = "0.16"
rustfft = "6.2"
webrtc-vad = "0.4"
# Кроссформатный аудиодекодер: WAV / MP3 / FLAC / OGG.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "vorbis", "ogg"] }

# CLI / progress (используется внутри подкрейтов в их dev-tools)
indicatif = "0.17"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

# Utilities
byteorder = "1.5"
memmap2 = "0.9"
crc32c = "0.6"
ciborium = "0.2"
sha2 = "0.10"
blake3 = "1.5"
fs4 = "0.13"
parking_lot = "0.12"
dashmap = "6.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
rand = "0.8"
once_cell = "1.20"

# Document processing для RAG: парсинг (md/html/pdf), chunking, walking.
htmd        = "0.5"
pdf-extract = "0.7"
ignore      = "0.4"

# Локальное хранилище для KB-индексов (rusqlite + FTS5). bundled = статически
# линкуется sqlite, без системной зависимости. blob — бинарные embedding'и.
rusqlite = { version = "0.37", features = ["bundled", "blob"] }

# vec0 virtual table — KNN/ANN индекс для KB при больших коллекциях.
sqlite-vec = "0.1"

# ── synaptix внешние зависимости. ──
bincode = "1.3"
postcard = { version = "1.0", features = ["alloc"] }
# Tensor primitives (CPU SIMD/parallelism).
half = { version = "2.4", features = ["num-traits", "bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
num-traits = "0.2"
rayon = "1.10"
wide = "0.7"
# CUDA bindings. NVRTC compiles kernels at runtime.
# Vendored upstream 0.19.8 + capture-aware patch: upstream records/waits CUDA events
# and calls stream.synchronize() from launch/device_ptr, which is illegal while a
# stream is capturing a graph (CUDA_ERROR_INVALID_VALUE). See third_party/cudarc/PATCH.md.
cudarc = { path = "third_party/cudarc", default-features = false, features = ["std", "driver", "nvrtc", "f16", "fallback-dynamic-loading", "cuda-version-from-build-system"] }
libc = "0.2"
minijinja = { version = "2.5", features = ["loader", "json", "preserve_order"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tempfile = "3.10"
aho-corasick = "1.1"
regex = "1.10"
pulldown-cmark = { version = "0.13", default-features = false }
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-scaling"] }

# synaptix internal crates (пути относительно корня workspace).
synaptix              = { path = "crates/synaptix" }
synaptix-core         = { path = "crates/synaptix-core" }
synaptix-test-utils   = { path = "crates/synaptix-test-utils" }
synaptix-autograd     = { path = "crates/synaptix-autograd" }
synaptix-dispatch     = { path = "crates/synaptix-dispatch" }
synaptix-kernels-cpu  = { path = "crates/synaptix-kernels-cpu" }
synaptix-kernels-cuda = { path = "crates/synaptix-kernels-cuda" }
synaptix-ops          = { path = "crates/synaptix-ops" }
synaptix-nn           = { path = "crates/synaptix-nn" }
synaptix-tokenizer    = { path = "crates/synaptix-tokenizer" }
synaptix-bundle       = { path = "crates/synaptix-bundle" }
synaptix-gguf         = { path = "crates/synaptix-gguf" }
synaptix-io           = { path = "crates/synaptix-io" }
synaptix-infer        = { path = "crates/synaptix-infer" }
synaptix-train        = { path = "crates/synaptix-train" }
synaptix-diffusion    = { path = "crates/synaptix-diffusion" }
synaptix-audio        = { path = "crates/synaptix-audio" }
synaptix-vision       = { path = "crates/synaptix-vision" }
synaptix-multimodal   = { path = "crates/synaptix-multimodal" }
synaptix-rag          = { path = "crates/synaptix-rag" }
synaptix-rl           = { path = "crates/synaptix-rl" }
synaptix-recsys       = { path = "crates/synaptix-recsys" }
synaptix-timeseries   = { path = "crates/synaptix-timeseries" }
synaptix-config       = { path = "crates/synaptix-config" }
synaptix-runtime      = { path = "crates/synaptix-runtime" }
synaptix-debug        = { path = "crates/synaptix-debug" }
synaptix-compile      = { path = "crates/synaptix-compile" }
synaptix-distributed  = { path = "crates/synaptix-distributed" }
synaptix-cli          = { path = "crates/synaptix-cli" }
synaptix-llm-qwen3    = { path = "crates/synaptix-models/llm/qwen3" }
synaptix-llm-qwen3-next-hybrid = { path = "crates/synaptix-models/llm/qwen3_next_hybrid" }
synaptix-llm-muse-glimmer = { path = "crates/synaptix-models/llm/muse_glimmer" }
synaptix-vlm-qwen3    = { path = "crates/synaptix-models/vlm/qwen3_vl" }
synaptix-llm-common   = { path = "crates/synaptix-models/llm/common" }
synaptix-asr-whisper  = { path = "crates/synaptix-models/asr/whisper" }
synaptix-image-sdxl   = { path = "crates/synaptix-models/image/sdxl" }
synaptix-depth-anything = { path = "crates/synaptix-models/image/depth_anything" }
synaptix-image-flux   = { path = "crates/synaptix-models/image/flux" }
synaptix-video-ltx23  = { path = "crates/synaptix-models/video/ltx23" }
synaptix-video-minimax-h3 = { path = "crates/synaptix-models/video/minimax_h3" }
synaptix-tts-voxcpm   = { path = "crates/synaptix-models/tts/voxcpm" }
synaptix-music-acestep = { path = "crates/synaptix-models/music/acestep" }
synaptix-llm-gemma3   = { path = "crates/synaptix-models/llm/gemma3" }
synaptix-llm-llama    = { path = "crates/synaptix-models/llm/llama" }
synaptix-asr-gigaam   = { path = "crates/synaptix-models/asr/gigaam" }
synaptix-embedding-bge-m3 = { path = "crates/synaptix-models/embedding/bge_m3" }
synaptix-diarization-sortformer = { path = "crates/synaptix-models/diarization/sortformer" }
synaptix-tts-omnivoice = { path = "crates/synaptix-models/tts/omnivoice" }
synaptix-tts-vibevoice = { path = "crates/synaptix-models/tts/vibevoice" }


[profile.release]
debug = false
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"

# Быстрая release-сборка для итераций: жертвуем 5-15% runtime ради 3-5×
# ускорения линковки. Использовать: `cargo build --profile fast-release`.
[profile.fast-release]
inherits = "release"
codegen-units = 256
lto = false
incremental = true

# В debug-сборке все ВНЕШНИЕ зависимости (path "*") компилируются с opt-level=3.
# Это критично для gemm/rustfft hot-path. Свой код (syngui/app/*) НЕ затронут —
# продолжает собираться быстро с opt-level=0 для итеративной разработки.
[profile.dev.package."*"]
opt-level = 3
codegen-units = 256

